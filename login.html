<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get started – StudyHub AI</title>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="auth-page">
  <main class="auth-main">
    <div class="auth-card">

      <!-- Logo -->
      <div class="login-brand">
        <div class="brand">
          <span class="brand-mark">S</span>
          StudyHub AI
        </div>
      </div>

      <!-- Heading -->
      <div class="login-head">
        <h1 class="login-title">Your subjects. Your schedule.</h1>
        <p class="login-sub">Your smarter way to study.</p>
      </div>

      <!-- Sign-in card -->
      <div class="card login-box">
        <h2>Sign in or create your account</h2>

        <div class="social-row">

          <button class="btn btn-social" id="google-btn" type="button">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            Continue with Google
          </button>

          <button class="btn btn-social" id="facebook-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continue with Facebook
          </button>

        </div>

        <p class="login-note">
          New here? You'll choose your name and nickname right after.
        </p>
      </div>

      <!-- What you get -->
      <div class="login-chips" aria-hidden="true">
        <span class="chip"><i class="c-primary"></i> Notes</span>
        <span class="chip"><i class="c-warning"></i> Deadlines</span>
        <span class="chip"><i class="c-success"></i> Quizzes</span>
        <span class="chip"><i class="c-accent"></i> AI study help</span>
      </div>

    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
